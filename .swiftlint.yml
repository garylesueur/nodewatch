included:
  - Sources
  - Tests

excluded:
  - .build
  - work
  - outputs

strict: true
reporter: xcode
cache_path: .swiftlint.cache

# SwiftFormat owns these overlapping style decisions.
disabled_rules:
  - opening_brace
  - trailing_comma

opt_in_rules:
  - array_init
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - modifier_order
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

function_parameter_count:
  warning: 7
  error: 8

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
